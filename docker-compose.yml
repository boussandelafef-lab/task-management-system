version: '3.8'
services:
  web:
    build: .
    container_name: task-management-web
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=task_management
  db:
    image: mysql:8.0
    container_name: task-management-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=task_management
    volumes:
      - db_data:/var/lib/mysql
      - ./task_management_db.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  db_data:
