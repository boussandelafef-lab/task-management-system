stages:
  - build
  - test
  - quality
  - package
  - deploy
  - performance
  - security
  - canary
  - deploy_prod

cache:
  key: "$CI_JOB_NAME"
  paths:
    - vendor/

variables:
  MYSQL_DATABASE: task_management_test
  MYSQL_ROOT_PASSWORD: root_password
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# ==================== BUILD ====================
build_job:
  stage: build
  image: php:8.2-cli-alpine
  script:
    - echo "Build started"
    - find . -name "*.php" -type f -exec php -l {} \;
    - echo "Build OK"

# ==================== TEST ====================
test_job:
  stage: test
  image: php:8.2-cli-alpine
  services:
    - name: mysql:8.0
      alias: mysql
  before_script:
    - apk add --no-cache mysql-client
    - docker-php-ext-install pdo_mysql mysqli
    - sleep 15
  script:
    - echo "DB TEST"
    - php -r '$db=new PDO("mysql:host=mysql;dbname=task_management_test","root","root_password"); echo "DB OK\n";'

# ==================== QUALITY ====================
quality_job:
  stage: quality
  image: php:8.2-cli-alpine
  allow_failure: true
  script:
    - echo "QUALITY CHECK"
    - grep -r "password_hash" app/ || echo "OK"
    - grep -r "prepare" app/ || echo "OK"

# ==================== PACKAGE ====================
package_job:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
  script:
    - zip -r app.zip . -x "vendor/*"
  artifacts:
    paths:
      - app.zip

# ==================== DEPLOY STAGING ====================
deploy_job:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-compose curl
  script:
    - echo "DEPLOY STAGING"
    - docker-compose up -d --build
    - sleep 20

    - CONTAINER=$(docker ps -qf "name=web")
    - if [ -z "$CONTAINER" ]; then echo "NO WEB CONTAINER" && exit 1; fi

    - docker exec $CONTAINER curl -f http://localhost || exit 1
    - echo "STAGING OK"

# ==================== PERFORMANCE ====================
performance_job:
  stage: performance
  image: alpine:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache apache2-utils docker-cli
  script:
    - echo "PERFORMANCE TEST"

    - CONTAINER=$(docker ps -qf "name=web")
    - if [ -z "$CONTAINER" ]; then echo "NO WEB CONTAINER" && exit 1; fi

    - ab -n 200 -c 10 http://localhost:8080/ > performance.txt

    - echo "DONE"
  artifacts:
    paths:
      - performance.txt
  allow_failure: true

# ==================== SECURITY ====================
security_job:
  stage: security
  image: alpine:latest
  allow_failure: true
  before_script:
    - apk add --no-cache grep
  script:
    - echo "SECURITY CHECK"
    - grep -r "\$_GET" . && echo "RISK FOUND" || echo "OK"
    - grep -r "password.*=" . --include="*.php" && echo "RISK" || echo "OK"

# ==================== CANARY ====================
canary_job:
  stage: canary
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-compose curl
  script:
    - echo "CANARY DEPLOY"
    - docker-compose -f docker-compose.canary.yml up -d --build
    - sleep 10
    - curl -f http://localhost:8081 || exit 1
    - echo "CANARY OK"
  when: manual

# ==================== PRODUCTION ====================
deploy_prod_job:
  stage: deploy_prod
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-compose curl
  script:
    - echo "PRODUCTION DEPLOY"

    - docker-compose down
    - docker-compose up -d --build
    - sleep 20

    - CONTAINER=$(docker ps -qf "name=web")
    - docker exec $CONTAINER curl -f http://localhost || exit 1

    - echo "PROD OK"
  when: manual