stages:
  - build
  - test
  - quality
  - package
  - deploy
  - performance
  - security
  - canary
  - deploy_prod

cache:
  paths:
    - vendor/
  key: "$CI_JOB_NAME"

variables:
  MYSQL_DATABASE: task_management_test
  MYSQL_ROOT_PASSWORD: root_password
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# ==================== BUILD ====================
build_job:
  stage: build
  image: php:8.2-cli-alpine
  script:
    - echo "Build started"
    - find . -name "*.php" -type f -exec php -l {} \;
    - echo "Build successful"

# ==================== TEST ====================
test_job:
  stage: test
  image: php:8.2-cli-alpine
  services:
    - mysql:8.0
  before_script:
    - apk add --no-cache mysql-client
    - docker-php-ext-install pdo_mysql mysqli
    - sleep 10
  script:
    - echo "E2E TEST START"
    - |
      php -r '
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $conn->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
      echo "DB Connected\n";
      '
    - |
      php -r '
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $conn->exec("CREATE TABLE IF NOT EXISTS users (id INT AUTO_INCREMENT PRIMARY KEY, full_name VARCHAR(50) NOT NULL, username VARCHAR(50) NOT NULL, password VARCHAR(255) NOT NULL, role ENUM(\"admin\",\"employee\") NOT NULL)");
      echo "Users table OK\n";
      '
    - |
      php -r '
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $conn->exec("CREATE TABLE IF NOT EXISTS tasks (id INT AUTO_INCREMENT PRIMARY KEY, title VARCHAR(100) NOT NULL, description TEXT, assigned_to INT, due_date DATE, status ENUM(\"pending\",\"in_progress\",\"completed\") DEFAULT \"pending\")");
      echo "Tasks table OK\n";
      '
    - |
      php -r '
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $conn->exec("CREATE TABLE IF NOT EXISTS notifications (id INT AUTO_INCREMENT PRIMARY KEY, message TEXT NOT NULL, recipient INT NOT NULL, type VARCHAR(50) NOT NULL, date DATETIME DEFAULT CURRENT_TIMESTAMP, is_read BOOLEAN DEFAULT FALSE)");
      echo "Notifications table OK\n";
      '
    - |
      php -r '
      $hash = password_hash("123", PASSWORD_DEFAULT);
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $conn->exec("INSERT INTO users (full_name, username, password, role) VALUES (\"Administrator\", \"admin\", \"$hash\", \"admin\")");
      echo "Admin created\n";
      '
    - |
      php -r '
      $hash = password_hash("employee123", PASSWORD_DEFAULT);
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $conn->exec("INSERT INTO users (full_name, username, password, role) VALUES (\"Sarah Johnson\", \"sarah\", \"$hash\", \"employee\")");
      echo "Employee created\n";
      '
    - |
      php -r '
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $stmt = $conn->query("SELECT id FROM users WHERE username=\"sarah\"");
      $sarah_id = $stmt->fetch()["id"];
      $conn->exec("INSERT INTO tasks (title, description, assigned_to, due_date, status) VALUES (\"Complete monthly report\", \"Prepare financial report\", $sarah_id, \"" . date("Y-m-d", strtotime("+7 days")) . "\", \"pending\")");
      echo "Task 1 created\n";
      '
    - |
      php -r '
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $stmt = $conn->query("SELECT id FROM users WHERE username=\"sarah\"");
      $sarah_id = $stmt->fetch()["id"];
      $conn->exec("INSERT INTO tasks (title, description, assigned_to, due_date, status) VALUES (\"Review client feedback\", \"Summarize feedback\", $sarah_id, \"" . date("Y-m-d") . "\", \"pending\")");
      echo "Task 2 created\n";
      '
    - |
      php -r '
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $count = $conn->query("SELECT COUNT(*) FROM users")->fetchColumn();
      echo "Total users: $count\n";
      $count = $conn->query("SELECT COUNT(*) FROM tasks")->fetchColumn();
      echo "Total tasks: $count\n";
      '
    - echo "E2E TESTS COMPLETED"

# ==================== QUALITY ====================
quality_job:
  stage: quality
  image: php:8.2-cli-alpine
  allow_failure: true
  script:
    - echo "Quality check"
    - grep -r "password_hash" app/ || echo "Missing password_hash"
    - grep -r "prepare" app/ || echo "Missing prepare"
    - echo "Quality check passed"

# ==================== PACKAGE ====================
package_job:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
  script:
    - echo "Creating package"
    - zip -r employee-task-management.zip *.php app/ inc/ css/ assets/ 2>/dev/null || true
    - echo "Package created"
  artifacts:
    paths:
      - employee-task-management.zip

# ==================== DEPLOY STAGING ====================
deploy_job:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli-compose curl
  script:
    - echo "DEPLOY STAGING START"
    - docker compose down || true
    - docker compose up -d --build
    - echo "Waiting application..."
    - |
      for i in 1 2 3 4 5 6; do
        curl -f http://localhost:8080 && break
        echo "Retry $i..."
        sleep 5
      done
    - CONTAINER=$(docker ps -qf "name=web")
    - if [ -z "$CONTAINER" ]; then echo "NO WEB CONTAINER" && exit 1; fi
    - echo "STAGING OK"
    # Sauvegarder le nom du conteneur pour les jobs suivants
    - echo "WEB_CONTAINER=$CONTAINER" > container.env
  artifacts:
    reports:
      dotenv: container.env
  environment:
    name: staging

# ==================== PERFORMANCE (corrigé) ====================
performance_job:
  stage: performance
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache curl apache2-utils
  script:
    - echo "PERFORMANCE TEST START"
    - echo "Testing container: $WEB_CONTAINER"
    
    # Vérifier que le conteneur existe
    - if [ -z "$WEB_CONTAINER" ]; then echo "ERROR: No web container found" && exit 1; fi
    
    # Installer ab (Apache Bench) dans le conteneur et tester
    - docker exec $WEB_CONTAINER sh -c "
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache apache2-utils
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y apache2-utils
        fi &&
        ab -n 200 -c 10 http://localhost:80/
      " > performance.txt
    
    - echo "PERFORMANCE TEST DONE"
  artifacts:
    paths:
      - performance.txt
  allow_failure: true
  needs:
    - deploy_job

# ==================== SECURITY ====================
security_job:
  stage: security
  image: alpine:latest
  allow_failure: true
  before_script:
    - apk add --no-cache grep
  script:
    - echo "SECURITY CHECK"
    - grep -r "\$_GET\|\$_POST" . && echo "RISK FOUND" || echo "OK"
    - grep -r "password.*=" . --include="*.php" && echo "RISK" || echo "OK"

# ==================== CANARY ====================
canary_job:
  stage: canary
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli-compose curl
  script:
    - echo "CANARY DEPLOY"
    - docker compose -f docker-compose.canary.yml down || true
    - docker compose -f docker-compose.canary.yml up -d --build
    - sleep 10
    - curl -f http://localhost:8080 || exit 1
    - echo "CANARY OK"
  when: manual

# ==================== PRODUCTION ====================
deploy_prod_job:
  stage: deploy_prod
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli-compose curl
  script:
    - echo "PRODUCTION DEPLOY"
    - docker compose down
    - docker compose up -d --build
    - echo "Waiting application..."
    - |
      for i in 1 2 3 4 5 6; do
        curl -f http://localhost:8080 && break
        echo "Retry $i..."
        sleep 5
      done
    - curl -f http://localhost:8080 || exit 1
    - echo "PROD OK"
  when: manual