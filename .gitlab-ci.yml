stages:
  - build
  - test
  - quality
  - package
  - deploy
  - performance
  - security
  - canary
  - deploy_prod

cache:
  paths:
    - vendor/
  key: "$CI_JOB_NAME"

variables:
  MYSQL_DATABASE: task_management_test
  MYSQL_ROOT_PASSWORD: root_password
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# ==================== BUILD ====================
build_job:
  stage: build
  image: php:8.2-cli-alpine
  script:
    - echo "Build started"
    - find . -name "*.php" -type f -exec php -l {} \;
    - echo "Build successful"

# ==================== TEST ====================
test_job:
  stage: test
  image: php:8.2-cli-alpine
  services:
    - mysql:8.0
  before_script:
    - apk add --no-cache mysql-client
    - docker-php-ext-install pdo_mysql mysqli
    - sleep 10
  script:
    - echo "E2E TEST START"

    - |
      php -r '
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $conn->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
      echo "DB Connected\n";
      '

    - |
      php -r '
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $conn->exec("CREATE TABLE IF NOT EXISTS users (id INT AUTO_INCREMENT PRIMARY KEY, full_name VARCHAR(50), username VARCHAR(50), password VARCHAR(255), role ENUM(\"admin\",\"employee\"))");
      echo "Users OK\n";
      '

    - |
      php -r '
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $conn->exec("CREATE TABLE IF NOT EXISTS tasks (id INT AUTO_INCREMENT PRIMARY KEY, title VARCHAR(100), description TEXT, assigned_to INT, due_date DATE, status ENUM(\"pending\",\"in_progress\",\"completed\") DEFAULT \"pending\")");
      echo "Tasks OK\n";
      '

    - |
      php -r '
      $hash = password_hash("123", PASSWORD_DEFAULT);
      $conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $conn->exec("INSERT INTO users (full_name, username, password, role) VALUES (\"Admin\", \"admin\", \"$hash\", \"admin\")");
      echo "Admin OK\n";
      '

    - echo "E2E TESTS COMPLETED"

# ==================== QUALITY ====================
quality_job:
  stage: quality
  image: php:8.2-cli-alpine
  allow_failure: true
  script:
    - echo "Quality check"
    - grep -r "password_hash" . || echo "Missing password_hash"
    - grep -r "prepare(" . || echo "Missing prepare"
    - echo "Quality check done"

# ==================== PACKAGE ====================
package_job:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
  script:
    - echo "Packaging..."
    - zip -r app.zip . -x "vendor/*" || true
  artifacts:
    paths:
      - app.zip

# ==================== DEPLOY ====================
deploy_job:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli-compose curl
  script:
    - echo "DEPLOY START"
    - docker compose down || true
    - docker compose up -d --build

    - echo "Waiting app..."
    - |
      for i in 1 2 3 4 5; do
        curl -f http://localhost:8080 && break
        sleep 5
      done

    - CONTAINER=$(docker ps -qf "name=web")
    - if [ -z "$CONTAINER" ]; then echo "NO CONTAINER" && exit 1; fi
    - echo "WEB_CONTAINER=$CONTAINER" > container.env

  artifacts:
    reports:
      dotenv: container.env

# ==================== PERFORMANCE ====================
performance_job:
  stage: performance
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache curl apache2-utils
  script:
    - echo "PERFORMANCE TEST START"
    - echo "Container: $WEB_CONTAINER"

    - |
      if [ -z "$WEB_CONTAINER" ]; then
        echo "ERROR: No container"
        exit 1
      fi

    - docker exec "$WEB_CONTAINER" sh -c "apk add --no-cache apache2-utils" || true
    - docker exec "$WEB_CONTAINER" sh -c "ab -n 100 -c 10 http://localhost:80/" > performance.txt

    - echo "PERFORMANCE DONE"
  artifacts:
    paths:
      - performance.txt
  allow_failure: true
  needs:
    - deploy_job

# ==================== SECURITY ====================
security_job:
  stage: security
  image: alpine
  allow_failure: true
  script:
    - echo "SECURITY SCAN"
    - grep -r "\$_GET\|\$_POST" . && echo "WARNING" || echo "OK"
    - grep -r "password\s*=" . && echo "WARNING" || echo "OK"

# ==================== CANARY ====================
canary_job:
  stage: canary
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli-compose curl
  script:
    - echo "CANARY DEPLOY"
    - docker compose -f docker-compose.canary.yml down || true
    - docker compose -f docker-compose.canary.yml up -d --build
    - sleep 10
    - curl -f http://localhost:8080
  when: manual

# ==================== PRODUCTION ====================
deploy_prod_job:
  stage: deploy_prod
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli-compose curl
  script:
    - echo "PROD DEPLOY"
    - docker compose down
    - docker compose up -d --build

    - |
      for i in 1 2 3 4 5; do
        curl -f http://localhost:8080 && break
        sleep 5
      done

    - curl -f http://localhost:8080
  when: manual