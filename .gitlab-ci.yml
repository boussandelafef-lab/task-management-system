stages:
  - build
  - test
  - quality
  - package
  - deploy

variables:
  MYSQL_DATABASE: task_management_test
  MYSQL_ROOT_PASSWORD: root_password
  DOCKER_HOST: unix:///var/run/docker.sock

cache:
  paths:
    - vendor/
  key: "$CI_JOB_NAME"

# ==================== BUILD ====================
build_job:
  stage: build
  tags:
    - shell
  script:
    - echo "Build started"
    - docker run --rm -v $(pwd):/app php:8.2-cli-alpine sh -c "cd /app && find . -name '*.php' -type f -exec php -l {} \;"
    - echo "Build successful"

# ==================== TEST ====================
test_job:
  stage: test
  tags:
    - shell
  script:
    - echo "E2E TEST START"
    # Démarrer MySQL
    - docker run -d --name mysql-test -e MYSQL_ROOT_PASSWORD=root_password -e MYSQL_DATABASE=task_management_test -p 3306:3306 mysql:8.0
    - sleep 15
    # Créer un fichier PHP temporaire
    - |
      cat > /tmp/test_db.php << 'PHPCODE'
      <?php
      try {
          $conn = new PDO("mysql:host=mysql-test;dbname=task_management_test", "root", "root_password");
          $conn->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          echo "DB Connected\n";
          
          $conn->exec("CREATE TABLE IF NOT EXISTS users (
              id INT AUTO_INCREMENT PRIMARY KEY,
              full_name VARCHAR(50) NOT NULL,
              username VARCHAR(50) NOT NULL,
              password VARCHAR(255) NOT NULL,
              role ENUM('admin','employee') NOT NULL
          )");
          echo "Users table OK\n";
          
          $conn->exec("CREATE TABLE IF NOT EXISTS tasks (
              id INT AUTO_INCREMENT PRIMARY KEY,
              title VARCHAR(100) NOT NULL,
              description TEXT,
              assigned_to INT,
              due_date DATE,
              status ENUM('pending','in_progress','completed') DEFAULT 'pending'
          )");
          echo "Tasks table OK\n";
          
          $conn->exec("CREATE TABLE IF NOT EXISTS notifications (
              id INT AUTO_INCREMENT PRIMARY KEY,
              message TEXT NOT NULL,
              recipient INT NOT NULL,
              type VARCHAR(50) NOT NULL,
              date DATETIME DEFAULT CURRENT_TIMESTAMP,
              is_read BOOLEAN DEFAULT FALSE
          )");
          echo "Notifications table OK\n";
          
          $hash = password_hash("123", PASSWORD_DEFAULT);
          $conn->exec("INSERT INTO users (full_name, username, password, role) VALUES ('Administrator', 'admin', '$hash', 'admin')");
          
          $hash2 = password_hash("employee123", PASSWORD_DEFAULT);
          $conn->exec("INSERT INTO users (full_name, username, password, role) VALUES ('Sarah Johnson', 'sarah', '$hash2', 'employee')");
          
          echo "Users created successfully\n";
          echo "E2E TESTS COMPLETED\n";
          
      } catch (PDOException $e) {
          echo "Error: " . $e->getMessage() . "\n";
          exit(1);
      }
      PHPCODE
    # Exécuter le script PHP avec l'extension PDO MySQL
    - docker run --rm --link mysql-test:mysql -v $(pwd):/app -v /tmp:/tmp php:8.2-cli-alpine sh -c "docker-php-ext-install pdo_mysql && php /tmp/test_db.php"
    - echo "✅ E2E TESTS COMPLETED"
  after_script:
    - docker stop mysql-test 2>/dev/null || true
    - docker rm mysql-test 2>/dev/null || true
    - rm -f /tmp/test_db.php 2>/dev/null || true

# ==================== QUALITY ====================
quality_job:
  stage: quality
  tags:
    - shell
  allow_failure: true
  script:
    - echo "Quality check"
    - docker run --rm -v $(pwd):/app php:8.2-cli-alpine sh -c "cd /app && grep -r 'password_hash' app/ 2>/dev/null || echo 'Missing password_hash'"
    - docker run --rm -v $(pwd):/app php:8.2-cli-alpine sh -c "cd /app && grep -r 'prepare' app/ 2>/dev/null || echo 'Missing prepare'"
    - echo "Quality check passed"

# ==================== PACKAGE ====================
package_job:
  stage: package
  tags:
    - shell
  script:
    - echo "Creating package"
    - sudo apt-get update
    - sudo apt-get install -y zip
    - zip -r employee-task-management.zip *.php app/ inc/ css/ assets/ 2>/dev/null || true
    - echo "Package created"
  artifacts:
    paths:
      - employee-task-management.zip

# ==================== DEPLOY ====================
deploy_staging_job:
  stage: deploy
  tags:
    - shell
  script:
    - echo "Deploying to staging..."
    - docker compose down --remove-orphans 2>/dev/null || true
    - docker compose up -d --build
    - sleep 10
    - docker compose ps
    - echo "Deployment completed"
    - echo "Application disponible sur http://localhost:8080"
  environment:
    name: staging
    url: http://localhost:8080
  only:
    - main