stages:
  - build
  - test
  - quality
  - package
  - deploy
  - performance
  - security
  - canary
  - deploy_prod

cache:
  paths:
    - vendor/
  key: "$CI_JOB_NAME"

variables:
  MYSQL_DATABASE: task_management_test
  MYSQL_ROOT_PASSWORD: root_password
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# ==================== BUILD ====================
build_job:
  stage: build
  image: php:8.2-cli-alpine
  script:
    - echo "Build started"
    - find . -name "*.php" -type f -exec php -l {} \;
    - echo "Build successful"

# ==================== TEST ====================
test_job:
  stage: test
  image: php:8.2-cli-alpine
  services:
    - mysql:8.0
  before_script:
    - apk add --no-cache mysql-client
    - docker-php-ext-install pdo_mysql mysqli
    - sleep 10
  script:
    - echo "E2E TEST START"
    - php -r '$conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password"); echo "DB Connected\n";'
    - echo "E2E TESTS COMPLETED"

# ==================== QUALITY ====================
quality_job:
  stage: quality
  image: php:8.2-cli-alpine
  allow_failure: true
  script:
    - echo "Quality check"
    - grep -r "password_hash" app/ || echo "Missing password_hash"
    - grep -r "prepare" app/ || echo "Missing prepare"
    - echo "Quality check passed"

# ==================== PACKAGE ====================
package_job:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
  script:
    - echo "Creating package"
    - zip -r employee-task-management.zip *.php app/ inc/ css/ assets/ 2>/dev/null || true
    - echo "Package created"
  artifacts:
    paths:
      - employee-task-management.zip

# ==================== DEPLOY STAGING ====================
deploy_job:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli-compose curl
  script:
    - echo "DEPLOY STAGING START"

    - docker compose down || true
    - docker compose up -d --build

    - echo "Waiting application..."
    - |
      for i in 1 2 3 4 5 6; do
        curl -f http://web:80 && break
        echo "Retry $i..."
        sleep 5
      done

    - CONTAINER=$(docker ps -qf "name=web")
    - if [ -z "$CONTAINER" ]; then echo "NO WEB CONTAINER" && exit 1; fi

    - echo "STAGING OK"

  environment:
    name: staging

# ==================== PERFORMANCE ====================
performance_job:
  stage: performance
  image: docker:latest
  services:
    - docker:dind

  variables:
    URL: http://web:80/
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - apk add --no-cache curl

  script:
    - echo "PERFORMANCE TEST START"

    # attendre l'application
    - |
      for i in $(seq 1 20); do
        if curl -s -f -o /dev/null $URL; then
          echo "Application is ready"
          break
        fi
        echo "Waiting for application... attempt $i/20"
        sleep 5
      done

    # lancer sitespeed avec options
    - mkdir -p sitespeed-results
    - |
      docker run --shm-size=1g --rm \
        -v "$(pwd)":/sitespeed.io \
        sitespeedio/sitespeed.io \
        $URL \
        --outputFolder sitespeed-results \
        --browsertime.chrome.args="disable-dev-shm-usage" \
        --cpu \
        --memory \
        --iterations 3

  artifacts:
    paths:
      - sitespeed-results/
    expire_in: 1 week
    when: always
# ==================== SECURITY ====================
security_job:
  stage: security
  image: alpine:latest
  allow_failure: true
  before_script:
    - apk add --no-cache grep
  script:
    - echo "SECURITY CHECK"
    - grep -r "\$_GET\|\$_POST" . && echo "RISK FOUND" || echo "OK"
    - grep -r "password.*=" . --include="*.php" && echo "RISK" || echo "OK"

# ==================== CANARY ====================
canary_job:
  stage: canary
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli-compose curl
  script:
    - echo "CANARY DEPLOY"

    - docker compose -f docker-compose.canary.yml down || true
    - docker compose -f docker-compose.canary.yml up -d --build

    - sleep 10
    - curl -f http://web:80 || exit 1

    - echo "CANARY OK"

  when: manual

# ==================== PRODUCTION ====================
deploy_prod_job:
  stage: deploy_prod
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli-compose curl
  script:
    - echo "PRODUCTION DEPLOY"

    - docker compose down
    - docker compose up -d --build

    - echo "Waiting application..."
    - |
      for i in 1 2 3 4 5 6; do
        curl -f http://web:80 && break
        echo "Retry $i..."
        sleep 5
      done

    - curl -f http://web:80 || exit 1

    - echo "PROD OK"

  when: manual