stages:
  - build
  - test
  - quality
  - package
  - deploy
  - performance
  - security
  - canary
  - deploy_prod

cache:
  paths:
    - vendor/
  key: "$CI_COMMIT_REF_SLUG"

variables:
  MYSQL_DATABASE: task_management_test
  MYSQL_ROOT_PASSWORD: root_password

# =========================
# BUILD
# =========================
build_job:
  stage: build
  image: php:8.2-cli-alpine
  script:
    - echo "Build started"
    - find . -name "*.php" -type f -exec php -l {} \;
    - echo "Build successful"

# =========================
# TEST
# =========================
test_job:
  stage: test
  image: php:8.2-cli-alpine
  services:
    - name: mysql:8.0
      alias: mysql

  before_script:
    - apk add --no-cache mysql-client
    - docker-php-ext-install pdo pdo_mysql mysqli
    - sleep 15

  script:
    - echo "E2E TEST START"

    - |
      php -r '
      $pdo = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");
      $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
      echo "DB Connected\n";
      '

    - |
      php -r '
      $pdo = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");

      $pdo->exec("CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        full_name VARCHAR(50),
        username VARCHAR(50),
        password VARCHAR(255),
        role ENUM(\"admin\",\"employee\")
      )");

      echo "Users table OK\n";
      '

    - |
      php -r '
      $pdo = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");

      $pdo->exec("CREATE TABLE IF NOT EXISTS tasks (
        id INT AUTO_INCREMENT PRIMARY KEY,
        title VARCHAR(100),
        description TEXT,
        assigned_to INT,
        due_date DATE,
        status ENUM(\"pending\",\"in_progress\",\"completed\")
      )");

      echo "Tasks table OK\n";
      '

    - |
      php -r '
      $pdo = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");

      $hash = password_hash("123", PASSWORD_DEFAULT);
      $stmt = $pdo->prepare("INSERT INTO users (full_name, username, password, role) VALUES (?, ?, ?, ?)");
      $stmt->execute(["Administrator", "admin", $hash, "admin"]);

      echo "Admin created\n";
      '

    - |
      php -r '
      $pdo = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");

      $hash = password_hash("employee123", PASSWORD_DEFAULT);
      $stmt = $pdo->prepare("INSERT INTO users (full_name, username, password, role) VALUES (?, ?, ?, ?)");
      $stmt->execute(["Sarah Johnson", "sarah", $hash, "employee"]);

      echo "Employee created\n";
      '

    - |
      php -r '
      $pdo = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password");

      $user = $pdo->query("SELECT id FROM users WHERE username=\"sarah\"")->fetch(PDO::FETCH_ASSOC);

      $stmt = $pdo->prepare("INSERT INTO tasks (title, description, assigned_to, due_date, status)
        VALUES (?, ?, ?, ?, ?)");

      $stmt->execute([
        "Complete monthly report",
        "Prepare financial report",
        $user["id"],
        date("Y-m-d", strtotime("+7 days")),
        "pending"
      ]);

      echo "Task created\n";
      '

    - echo "E2E TESTS DONE"

# =========================
# QUALITY
# =========================
quality_job:
  stage: quality
  image: php:8.2-cli-alpine
  allow_failure: true
  script:
    - echo "Quality check"
    - grep -r "password_hash" app/ || echo "OK password_hash"
    - grep -r "prepare(" app/ || echo "Warning: missing prepare statements"
    - echo "Quality done"

# =========================
# PACKAGE
# =========================
package_job:
  stage: package
  image: alpine:latest

  before_script:
    - apk add --no-cache zip

  script:
    - echo "Creating package"
    - zip -r employee-task-management.zip . \
      -x "vendor/*" ".git/*" "node_modules/*"
    - echo "Package created"

  artifacts:
    paths:
      - employee-task-management.zip

# =========================
# DEPLOY STAGING
# =========================
deploy_job:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind

  before_script:
    - apk add --no-cache docker-compose curl

  script:
    - |
      set -e

      echo "DEPLOY STAGING"

      docker-compose up -d --build
      sleep 20

      docker ps

      CONTAINER_ID=$(docker ps -qf 'name=web')

      if [ -z "$CONTAINER_ID" ]; then
        echo "ERROR: web container not found"
        exit 1
      fi

      docker exec "$CONTAINER_ID" curl -f http://localhost

      echo "STAGING OK"

  environment:
    name: staging
    url: http://localhost:8080

# =========================
# PERFORMANCE
# =========================
performance_job:
  stage: performance
  image: alpine:latest
  allow_failure: true

  before_script:
    - apk add --no-cache curl

  script:
    - echo "PERFORMANCE TEST"
    - curl -o /dev/null -s -w "Time: %{time_total}s\n" http://localhost:8080/ > perf.txt
    - cat perf.txt
    - echo "DONE"

  artifacts:
    paths:
      - perf.txt

# =========================
# SECURITY
# =========================
security_job:
  stage: security
  image: alpine:latest
  allow_failure: true

  before_script:
    - apk add --no-cache grep

  script:
    - echo "SECURITY SCAN"
    - grep -r "SELECT.*\$_GET" . --include="*.php" || echo "No SQL injection patterns"
    - grep -r "password.*=.*['\"]" . --include="*.php" | grep -v "password_hash" || echo "OK"
    - echo "SECURITY DONE"

# =========================
# CANARY
# =========================
canary_job:
  stage: canary
  image: docker:latest
  services:
    - docker:dind

  before_script:
    - apk add --no-cache docker-compose

  script:
    - echo "CANARY DEPLOY"
    - docker-compose -f docker-compose.canary.yml up -d --build
    - sleep 10
    - docker ps
    - echo "CANARY OK"

  environment:
    name: canary
    url: http://localhost:8081
  when: manual

# =========================
# PRODUCTION
# =========================
deploy_prod_job:
  stage: deploy_prod
  image: docker:latest
  services:
    - docker:dind

  before_script:
    - apk add --no-cache docker-compose curl

  script:
    - |
      set -e

      echo "PRODUCTION DEPLOY"

      docker-compose down
      docker-compose up -d --build
      sleep 20

      CONTAINER_ID=$(docker ps -qf 'name=web')

      if [ -z "$CONTAINER_ID" ]; then
        echo "ERROR: no container found"
        exit 1
      fi

      docker exec "$CONTAINER_ID" curl -f http://localhost

      echo "PRODUCTION OK"

  environment:
    name: production
    url: http://localhost:8080
  when: manual