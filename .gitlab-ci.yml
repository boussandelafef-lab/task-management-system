stages:
  - build
  - test
  - quality
  - package
  - deploy

variables:
  MYSQL_DATABASE: task_management_test
  MYSQL_ROOT_PASSWORD: root_password
  # Pour shell runner, on utilise le socket Docker local
  DOCKER_HOST: unix:///var/run/docker.sock

cache:
  paths:
    - vendor/
  key: "$CI_JOB_NAME"

# ==================== BUILD ====================
build_job:
  stage: build
  tags:
    - shell
  script:
    - echo "Build started"
    - php -l *.php 2>/dev/null || true
    - find . -name "*.php" -type f -exec php -l {} \;
    - echo "Build successful"

# ==================== TEST ====================
test_job:
  stage: test
  tags:
    - shell
  before_script:
    - sudo apt-get update
    - sudo apt-get install -y mysql-client php8.2-mysql
    - sudo service mysql start || true
    - sleep 5
  script:
    - echo "E2E TEST START"
    - |
      php -r '
      $conn = new PDO("mysql:host=127.0.0.1;dbname=task_management_test", "root", "root_password");
      $conn->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
      echo "DB Connected\n";
      $conn->exec("CREATE TABLE IF NOT EXISTS users (id INT AUTO_INCREMENT PRIMARY KEY, full_name VARCHAR(50) NOT NULL, username VARCHAR(50) NOT NULL, password VARCHAR(255) NOT NULL, role ENUM(\"admin\",\"employee\") NOT NULL)");
      echo "Users table OK\n";
      $conn->exec("CREATE TABLE IF NOT EXISTS tasks (id INT AUTO_INCREMENT PRIMARY KEY, title VARCHAR(100) NOT NULL, description TEXT, assigned_to INT, due_date DATE, status ENUM(\"pending\",\"in_progress\",\"completed\") DEFAULT \"pending\")");
      echo "Tasks table OK\n";
      $conn->exec("CREATE TABLE IF NOT EXISTS notifications (id INT AUTO_INCREMENT PRIMARY KEY, message TEXT NOT NULL, recipient INT NOT NULL, type VARCHAR(50) NOT NULL, date DATETIME DEFAULT CURRENT_TIMESTAMP, is_read BOOLEAN DEFAULT FALSE)");
      echo "Notifications table OK\n";
      $hash = password_hash("123", PASSWORD_DEFAULT);
      $conn->exec("INSERT INTO users (full_name, username, password, role) VALUES (\"Administrator\", \"admin\", \"$hash\", \"admin\")");
      $hash2 = password_hash("employee123", PASSWORD_DEFAULT);
      $conn->exec("INSERT INTO users (full_name, username, password, role) VALUES (\"Sarah Johnson\", \"sarah\", \"$hash2\", \"employee\")");
      echo "Users created\n";
      '
    - echo "E2E TESTS COMPLETED"

# ==================== QUALITY ====================
quality_job:
  stage: quality
  tags:
    - shell
  allow_failure: true
  script:
    - echo "Quality check"
    - grep -r "password_hash" app/ 2>/dev/null || echo "Missing password_hash"
    - grep -r "prepare" app/ 2>/dev/null || echo "Missing prepare"
    - echo "Quality check passed"

# ==================== PACKAGE ====================
package_job:
  stage: package
  tags:
    - shell
  script:
    - echo "Creating package"
    - sudo apt-get update
    - sudo apt-get install -y zip
    - zip -r employee-task-management.zip *.php app/ inc/ css/ assets/ 2>/dev/null || true
    - echo "Package created"
  artifacts:
    paths:
      - employee-task-management.zip

# ==================== DEPLOY ====================
deploy_staging_job:
  stage: deploy
  tags:
    - shell
  script:
    - echo "Deploying to staging..."
    - docker compose down --remove-orphans 2>/dev/null || true
    - docker compose up -d --build
    - sleep 10
    - docker compose ps
    - echo "Deployment completed"
    - echo "Application disponible sur http://localhost:8080"
  environment:
    name: staging
    url: http://localhost:8080
  only:
    - main