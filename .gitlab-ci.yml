stages:
  - build
  - test
  - quality
  - package
  - deploy
  - performance
  - security

cache:
  paths:
    - vendor/
  key: "$CI_JOB_NAME"

variables:
  MYSQL_DATABASE: task_management_test
  MYSQL_ROOT_PASSWORD: root_password

# =========================
# BUILD
# =========================
build_job:
  stage: build
  image: php:8.2-cli-alpine
  script:
    - echo "Build started"
    - find . -name "*.php" -type f -exec php -l {} \;
    - echo "Build successful"

# =========================
# TEST
# =========================
test_job:
  stage: test
  image: php:8.2-cli-alpine
  services:
    - mysql:8.0
  before_script:
    - apk add --no-cache mysql-client
    - docker-php-ext-install pdo_mysql mysqli
    - sleep 10
  script:
    - echo "E2E TEST START"

    - php -r '$conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password"); echo "DB Connected\n";'

    - php -r '$conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password"); $conn->exec("CREATE TABLE IF NOT EXISTS users (id INT AUTO_INCREMENT PRIMARY KEY, full_name VARCHAR(50), username VARCHAR(50), password VARCHAR(255), role ENUM(\"admin\",\"employee\"))");'

    - php -r '$conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password"); $conn->exec("CREATE TABLE IF NOT EXISTS tasks (id INT AUTO_INCREMENT PRIMARY KEY, title VARCHAR(100), description TEXT, assigned_to INT, due_date DATE, status ENUM(\"pending\",\"in_progress\",\"completed\") DEFAULT \"pending\")");'

    - php -r '$conn = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password"); echo "Tables OK\n";'

    - echo "E2E TESTS COMPLETED"

# =========================
# QUALITY
# =========================
quality_job:
  stage: quality
  image: php:8.2-cli-alpine
  allow_failure: true
  script:
    - echo "Quality check"
    - grep -r "password_hash" app/ || echo "Missing password_hash"
    - grep -r "prepare" app/ || echo "Missing prepare"
    - echo "Quality check passed"

# =========================
# PACKAGE
# =========================
package_job:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
  script:
    - echo "Creating package"
    - zip -r employee-task-management.zip *.php app/ inc/ css/ assets/ 2>/dev/null || true
    - echo "Package created"
  artifacts:
    paths:
      - employee-task-management.zip

# =========================
# DEPLOY (STAGING)
# =========================
deploy_staging:
  stage: deploy_staging
  image: alpine
  script:
    - apk add --no-cache docker-cli-compose
    - export DOCKER_HOST=tcp://docker:2375
    - docker compose down
    - docker compose up -d
    - echo "Staging OK"
  environment:
    name: staging
    url: http://staging.local
# =========================
# PERFORMANCE (simple test)
# =========================
performance_job:
  stage: performance
  image: alpine
  script:
    - apk add --no-cache curl
    - echo "Test de charge"
    - curl -I http://staging.local

# =========================
# SECURITY (simple scan simulation)
# =========================
security_job:
  stage: security
  image: alpine
  script:
    - echo "Security scan simulation"
    - grep -r "password" . || echo "No hardcoded password detected"