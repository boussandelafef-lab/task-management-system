stages:
  - build
  - test
  - quality
  - package
  - deploy_staging
  - performance
  - security
  - canary
  - deploy_prod

cache:
  paths:
    - vendor/
  key: "$CI_JOB_NAME"

variables:
  MYSQL_DATABASE: task_management_test
  MYSQL_ROOT_PASSWORD: root_password
  # Variables spécifiques Codespaces
  CODESPACE_NAME: ${CODESPACE_NAME}
  GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}
  # Pour Docker dans Codespaces
  DOCKER_HOST: unix:///var/run/docker.sock

# ... (garder vos jobs build, test, quality identiques) ...

# ========== DÉPLOIEMENT STAGING (CODESPACES) ==========
deploy_staging_job:
  stage: deploy_staging
  image: docker:latest
  before_script:
    - apk add --no-cache docker-compose curl
  script:
    - echo "🚀 Déploiement sur Codespaces"
    - docker-compose up -d --build
    - sleep 10
    - PORT=8080
    - URL="https://${CODESPACE_NAME}-${PORT}.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}"
    - curl -f $URL/index.php || echo "⚠️ Application non accessible"
  environment:
    name: staging
    url: ${URL}
  only:
    - main

# ========== TESTS DE PERFORMANCE ==========
performance_job:
  stage: performance
  image: alpine:latest
  variables:
    PORT: 8080
    URL: "https://${CODESPACE_NAME}-${PORT}.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}"
  script:
    - apk add --no-cache curl apache2-utils
    - echo "📊 Tests de performance sur $URL"
    - |
      for i in $(seq 1 30); do
        if curl -s -o /dev/null -w "%{http_code}" $URL | grep -q "200"; then
          echo "✅ Application prête"
          break
        fi
        echo "⏳ Attente... ($i/30)"
        sleep 5
      done
    - ab -n 100 -c 10 $URL > performance_results.txt
    - cat performance_results.txt
  artifacts:
    paths:
      - performance_results.txt
  allow_failure: true

# ========== CANARY RELEASE ==========
canary_job:
  stage: canary
  image: docker:latest
  before_script:
    - apk add --no-cache docker-compose
  script:
    - echo "🐦 DÉPLOIEMENT CANARY"
    # Utiliser un port différent pour canary
    - sed -i 's/8080:80/8081:80/' docker-compose.yml
    - docker-compose -p canary up -d
    - PORT=8081
    - CANARY_URL="https://${CODESPACE_NAME}-${PORT}.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}"
    - echo "✅ Version canary déployée sur $CANARY_URL"
  environment:
    name: canary
    url: ${CANARY_URL}
  when: manual
  only:
    - main

# ========== DÉPLOIEMENT PRODUCTION ==========
deploy_prod_job:
  stage: deploy_prod
  image: docker:latest
  before_script:
    - apk add --no-cache docker-compose
  script:
    - echo "🏭 DÉPLOIEMENT EN PRODUCTION"
    - echo "Vérification finale..."
    - docker-compose down
    - docker-compose up -d --build
    - PORT=8080
    - PROD_URL="https://${CODESPACE_NAME}-${PORT}.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}"
    - echo "✅ Application déployée sur $PROD_URL"
    - docker-compose ps
  environment:
    name: production
    url: ${PROD_URL}
  when: manual
  only:
    - main