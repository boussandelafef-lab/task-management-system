stages:
  - build
  - test
  - quality
  - package

cache:
  paths:
    - vendor/
  key: "$CI_JOB_NAME"

# Étape 1 : Build (vérification syntaxique)
syntax_check:
  stage: build
  image: php:8.2-cli-alpine
  before_script:
    - apk add --no-cache git
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-progress --no-interaction || true
  script:
    - echo " Vérification de la syntaxe PHP..."
    - find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
    - echo " Syntaxe PHP valide"

# Étape 2 : Test (fichiers critiques)
file_check:
  stage: test
  image: php:8.2-cli-alpine
  script:
    - echo " Vérification des fichiers critiques..."
    - test -f index.php && echo " index.php"
    - test -f login.php && echo " login.php"
    - test -f DB_connection.php && echo " DB_connection.php"
    - echo " Tous les fichiers sont présents"

# Étape 3 : Quality - Analyse statique avec PHPStan
phpstan:
  stage: quality
  image: php:8.2-cli-alpine
  before_script:
    - apk add --no-cache git
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar require --dev phpstan/phpstan --no-progress --no-interaction
  script:
    - echo " Analyse statique du code avec PHPStan..."
    - vendor/bin/phpstan analyse . --level=1 --no-progress || true
  allow_failure: true
  artifacts:
    paths:
      - phpstan-report.txt
    when: always

# Étape 3b : Quality - Vérification des normes de codage
phpcs:
  stage: quality
  image: php:8.2-cli-alpine
  before_script:
    - apk add --no-cache git
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar require --dev squizlabs/php_codesniffer --no-progress --no-interaction
  script:
    - echo " Vérification des normes PSR-12..."
    - vendor/bin/phpcs --standard=PSR12 *.php || true
  allow_failure: true
  artifacts:
    paths:
      - phpcs-report.txt
    when: always

# Étape 4 : Package - Création du package de déploiement
package_job:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
  script:
    - echo "📦 Création du package de déploiement..."
    - mkdir deploy-package
    - cp -r *.php inc/ css/ assets/ img/ deploy-package/ 2>/dev/null || true
    - cp DB_connection.php deploy-package/ 2>/dev/null || true
    - cp task_management_db.sql deploy-package/ 2>/dev/null || true
    - cd deploy-package && zip -r ../employee-task-management.zip .
    - cd ..
    - echo "✅ Package créé : employee-task-management.zip"
  artifacts:
    paths:
      - employee-task-management.zip
    expire_in: 1 week