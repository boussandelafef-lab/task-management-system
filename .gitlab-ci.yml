stages:
  - build
  - test
  - quality
  - package
  - deploy
  - performance
  - security

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - vendor/

variables:
  MYSQL_DATABASE: task_management_test
  MYSQL_ROOT_PASSWORD: root_password
  DOCKER_HOST: tcp://docker:2375
  STAGING_URL: http://staging.local
  PROD_URL: http://production.local

# =========================
# BUILD
# =========================
build_job:
  stage: build
  image: php:8.2-cli-alpine
  script:
    - echo "Build started"
    - find . -name "*.php" -type f -exec php -l {} \;
    - echo "Build successful"

# =========================
# TEST (MySQL + PHP)
# =========================
test_job:
  stage: test
  image: php:8.2-cli-alpine
  services:
    - mysql:8.0
  before_script:
    - apk add --no-cache mysql-client
    - docker-php-ext-install pdo_mysql mysqli || true
    - sleep 15
  script:
    - echo "Testing DB connection"

    - php -r '$pdo = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password"); echo "DB Connected\n";'

    - php -r '$pdo = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password"); 
      $pdo->exec("CREATE TABLE IF NOT EXISTS users (id INT AUTO_INCREMENT PRIMARY KEY, full_name VARCHAR(50), username VARCHAR(50), password VARCHAR(255), role ENUM(\"admin\",\"employee\"))");'

    - php -r '$pdo = new PDO("mysql:host=mysql;dbname=task_management_test", "root", "root_password"); 
      $pdo->exec("CREATE TABLE IF NOT EXISTS tasks (id INT AUTO_INCREMENT PRIMARY KEY, title VARCHAR(100), description TEXT, assigned_to INT, due_date DATE, status ENUM(\"pending\",\"in_progress\",\"completed\") DEFAULT \"pending\")");'

    - echo "TESTS SUCCESSFUL"

# =========================
# QUALITY (corrigé - PAS d'erreur script)
# =========================
quality_job:
  stage: quality
  image: php:8.2-cli-alpine
  allow_failure: true
  script:
    - echo "Code quality check started"
    - grep -r "password_hash" . || echo "Warning: password_hash missing"
    - grep -r "prepare" . || echo "Warning: prepared statements missing"
    - echo "Quality check finished"

# =========================
# PACKAGE (ZIP artifact)
# =========================
package_job:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
  script:
    - echo "Creating package"
    - zip -r app.zip . -x "*.git*" "*.zip" "vendor/*"
    - echo "Package created"
  artifacts:
    paths:
      - app.zip

# =========================
# DEPLOY STAGING
# =========================
deploy_staging:
  stage: deploy
  image: alpine
  script:
    - apk add --no-cache docker-cli-compose
    - echo "Deploying to staging..."
    - export DOCKER_HOST=$DOCKER_HOST
    - docker compose down
    - docker compose up -d
    - echo "Staging deployed"
  environment:
    name: staging
    url: $STAGING_URL

# =========================
# PERFORMANCE TEST
# =========================
performance_job:
  stage: performance
  image: alpine
  script:
    - apk add --no-cache curl
    - echo "Performance test running"
    - curl -I $STAGING_URL

# =========================
# SECURITY CHECK
# =========================
security_job:
  stage: security
  image: alpine
  script:
    - echo "Security scan"
    - grep -r "password" . || echo "No hardcoded passwords found"
    - grep -r "root_password" . || echo "No exposed root password found"

# =========================
# DEPLOY PRODUCTION (MANUAL)
# =========================
deploy_prod:
  stage: deploy
  image: alpine
  script:
    - apk add --no-cache docker-cli-compose
    - echo "Deploying to production..."
    - export DOCKER_HOST=$DOCKER_HOST
    - docker compose up -d
    - echo "Production deployed"
  environment:
    name: production
    url: $PROD_URL
  when: manual

# =========================
# CANARY RELEASE (OPTIONNEL)
# =========================
canary:
  stage: deploy
  image: alpine
  script:
    - echo "Canary deployment started"
    - echo "Small percentage of users redirected"
  environment:
    name: canary
  when: manual
  only:
    - main